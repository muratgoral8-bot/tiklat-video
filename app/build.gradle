plugins {
    id 'com.android.application'
}

android {
    namespace 'com.muratgoral.tiklatauto'
    compileSdk 35

    defaultConfig {
        applicationId 'com.muratgoral.tiklatauto'
        minSdk 26
        targetSdk 35
        // GitHub Actions'ta her derlemede artar.
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    // Sabit imza: her derleme aynı anahtarla imzalanır, böylece yeni sürüm eskisinin üzerine kurulur
    // (giriş/çerezler silinmez). Kişisel kullanım içindir.
    signingConfigs {
        fixed {
            storeFile file('tiklat.keystore')
            storePassword 'tiklat123'
            keyAlias 'tiklat'
            keyPassword 'tiklat123'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Ekran: Android'in kendi WebView'i. Android Auto medya bölümü: AndroidX Media3.
dependencies {
    def media3 = '1.3.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-session:$media3"
    implementation 'com.google.guava:guava:32.1.3-android'
}
