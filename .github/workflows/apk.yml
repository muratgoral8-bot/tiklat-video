name: APK
on:
  push:
    branches: [arac-video]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Derle
        run: gradle --no-daemon --stacktrace assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: tiklat-video-imzasiz
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
      - name: Derleme ciktisini yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/video/release/*.apk tiklat-video-imzasiz.apk
          cp app/build/outputs/apk/arka/release/*.apk tiklat-arka-imzasiz.apk
          cp app/build/outputs/apk/surus/release/*.apk tiklat-surus-imzasiz.apk
          cp app/build/outputs/apk/ekran/release/*.apk tiklat-ekran-imzasiz.apk
          gh release view arac-derleme >/dev/null 2>&1 || gh release create arac-derleme --target arac-video --prerelease --title "Tiklat Video arac (imzasiz derleme)" --notes "Kurulum icin degil: imzali APK sohbetten gonderilir."
          gh release upload arac-derleme tiklat-video-imzasiz.apk tiklat-arka-imzasiz.apk tiklat-surus-imzasiz.apk tiklat-ekran-imzasiz.apk --clobber
